name: ARM Build Test

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  arm-build:
    name: ARM64 Build Test
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build ARM64 image (native runner)
      timeout-minutes: 30
      run: |
        docker buildx build \
          --platform linux/arm64 \
          --tag ai-sre:arm64-test \
          --load \
          .

    - name: Run ARM64 container
      run: |
        docker run -d --name ai-sre-arm64-test -p 8080:8080 ai-sre:arm64-test
        sleep 10
        curl -f http://localhost:8080/health
        docker exec ai-sre-arm64-test kubectl version --client
        docker exec ai-sre-arm64-test helm version --client
        docker exec ai-sre-arm64-test flux version --client

    - name: Cleanup
      if: always()
      run: |
        docker stop ai-sre-arm64-test 2>/dev/null || true
        docker rm ai-sre-arm64-test 2>/dev/null || true
        
  # Note: dropped the redundant cross-arch buildx job. The matrix in
  # `build-and-push` (ci-cd.yml) already produces a multi-arch manifest
  # via native runners; emulating both arches under qemu here just
  # exceeded GitHub Actions' job timeouts.
