---
# Weekly scheduled rebuild of the newest RELEASE (highest `v*` git tag)
# against a fresh base: re-pulls alpine and re-runs the Dockerfile's
# `apk update && apk upgrade` with no build cache, so Alpine + bundled-tool
# security fixes land without a code change.
#
# Tag scheme (Scheme V, cberg weekly-rebuild program): `<version>-b<YYYYMMDD>`
# plus `weekly`. The plain `<version>` tag the cluster pins (e.g. 2.1.5) is
# deliberately NOT overwritten -- a pinned tag must not change content
# underneath the cluster. Deploying a rebuild is a tag bump / ImagePolicy
# selection in cberg-home-nextgen.
#
# Before 2026-09-27 this workflow built master HEAD and published `weekly`,
# `weekly-<date>` and `sha-<40hex>` -- none of which a semver-pinned cluster
# could select, so the rebuilds were never deployable.
#
# Keepalive: GitHub disables scheduled workflows after 60 days without repo
# activity (this schedule silently stopped in July). The last job re-enables
# this workflow on every run, which resets that timer.
name: Scheduled Rebuild

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to rebuild (default: newest v* tag)"
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/ai-sre

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
      build: ${{ steps.rel.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: rel
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${INPUT_TAG:-$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)}"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "unexpected tag '$tag'"; exit 1;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  rebuild:
    name: Weekly rebuild (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for smoke test (no-cache so base + apk are fresh)
        uses: docker/build-push-action@v6
        with:
          context: .
          no-cache: true
          pull: true
          load: true
          platforms: ${{ matrix.platform }}
          tags: ai-sre:smoke
          provenance: false

      # Same checks as ci-cd.yml's Test Suite job, native on each arch.
      - name: Smoke test (MCP server + bundled CLIs)
        run: |
          docker run -d --name ai-sre-test -p 8080:8080 ai-sre:smoke
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/health && break; sleep 1; done
          curl -f http://localhost:8080/health || { docker logs ai-sre-test; exit 1; }
          r=$(curl -s -X POST http://localhost:8080/mcp/http -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"weekly","version":"1.0.0"}}}')
          echo "$r" | grep -q protocolVersion || { echo "$r"; docker logs ai-sre-test; exit 1; }
          r=$(curl -s -X POST http://localhost:8080/mcp/http -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
          echo "$r" | grep -q kubectl_get || { echo "$r"; exit 1; }
          docker exec ai-sre-test kubectl version --client
          docker exec ai-sre-test helm version --client
          docker exec ai-sre-test flux version --client
          docker exec ai-sre-test git --version
          docker rm -f ai-sre-test

      # Reuses the fresh layers the no-cache build above just produced in this
      # builder, so what is pushed is what was smoke-tested.
      - name: Push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.tag }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Tag weekly multi-arch manifest
    runs-on: ubuntu-latest
    needs: [resolve, rebuild]
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      REF: ghcr.io/${{ github.repository_owner }}/ai-sre:${{ needs.resolve.outputs.version }}-b${{ needs.resolve.outputs.build }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: weekly-digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$REF" \
            -t ${{ env.IMAGE }}:weekly \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect "$REF"

      - name: Trivy scan (informational — does not fail the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REF }}
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table

      - name: Keepalive (re-enable this workflow; resets the 60-day inactivity timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scheduled-rebuild.yml/enable"
