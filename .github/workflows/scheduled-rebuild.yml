---
# Weekly scheduled rebuild — picks up Alpine + bundled-tool security
# patches without requiring a code change. The Dockerfile uses
# `apk update && apk upgrade` at the start, so a fresh build absorbs
# any package-tracker patches that have landed since the last release.
#
# Why this exists: a CVE scan on this image (Trivy 0.70.0, 2026-05-09)
# flagged 14 CRITICAL + 62 HIGH vulnerabilities, ALL fixable. Breakdown:
#   - 35 Go stdlib (embedded in kubectl, helm, flux, k9s) → bumping the
#     ARG pins in Dockerfile already handled by this PR's sibling commits.
#   - 17 Alpine system pkgs (libcrypto3, libssl3, libexpat) → handled by
#     `apk upgrade` on rebuild.
#   - 24 Go modules (docker, moby, oauth2, x/crypto, go-git) → handled
#     by bumping the binaries that embed them (kubectl/helm/flux/k9s).
#
# Without a scheduled rebuild, the image only changes when source code
# does, so OS + Go-stdlib CVEs accumulate quietly. Weekly cron + the
# existing version pins keep the bug-fix flow moving.
name: Scheduled Rebuild

on:
  schedule:
    # Every Monday at 06:00 UTC. Picks up Alpine patches typically
    # published mid-week. Also triggers on workflow_dispatch.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/ai-sre

jobs:
  rebuild:
    name: Weekly rebuild (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push by digest (no-cache so base + apk are fresh)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          no-cache: true
          pull: true
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Tag weekly multi-arch manifest
    runs-on: ubuntu-latest
    needs: rebuild
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: weekly-digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute date tag
        id: date
        run: echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:weekly \
            -t ${{ env.IMAGE }}:weekly-${{ steps.date.outputs.tag }} \
            -t ${{ env.IMAGE }}:sha-${{ github.sha }} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Trivy scan (informational — does not fail the build)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:weekly-${{ steps.date.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table
